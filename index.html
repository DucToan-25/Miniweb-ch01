<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><MINIWEB-></title>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h3>ĐĂNG NHẬP ĐỂ XEM QUÀ 💕</h3>
            <form id="login-form">
                <div class="input-group">
                    <label for="username">Tài khoản (ID):</label>
                    <input type="text" id="username" placeholder="Nhập tài khoản..." required autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="password">Mật khẩu (Pass):</label>
                    <input type="password" id="password" placeholder="Nhập mật khẩu số..." required pattern="[0-9]*" inputmode="numeric">
                </div>
                <button type="submit" class="login-btn">Đăng nhập</button>
                <div id="login-error"></div>
            </form>
        </div>
    </div>

    <audio id="bg-music" src="mussic.mp3" loop></audio>

<div id="text-container">
    <h1 class="draggable" style="top: 15%; left: 20%;">Tình yêu</h1>
    <h2 class="draggable" style="top: 30%; left: 30%;">LOVE</h2>
    
    <!-- Đã xóa width, chỉ giữ lại tọa độ kéo thả -->
    <img src="bohoa.png" alt="Ảnh kỷ niệm 1" class="draggable" style="top: 50%; left: 15%;">
    <img src="bonghong.png" alt="Ảnh kỷ niệm 2" class="draggable" style="top: 50%; left: 65%;">
</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module" src="main.js"></script>
    
</body>
</html>
